# Build configuration for IQ Lock Android App
# JVM Memory and Encoding
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# Enable configuration caching for faster builds
org.gradle.configuration-cache=true

# Enable parallel builds
org.gradle.parallel=true

# AndroidX migration
android.useAndroidX=true

# Kotlin code style
kotlin.code.style=official

# Non-transitive R class (reduces APK size)
android.nonTransitiveRClass=true

# Suppress warnings about deprecated Gradle features
org.gradle.warning.mode=summary
