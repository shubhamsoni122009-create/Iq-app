name: Build IQ Lock APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Make Gradle wrapper executable
        working-directory: iq-lock
        run: chmod +x gradlew

      - name: Build Debug APK
        working-directory: iq-lock
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: IQLock-debug
          path: iq-lock/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
